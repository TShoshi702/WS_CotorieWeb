server
{
 listen 80 default_server;
 listen [::]:80 default_server;
 server_name wordpress.local;
 index index.php index.html index.htm default.php default.htm default.html;
 root /usr/local/lighthouse/softwares/wordpress;
 
 # ===== CORS — 允许 Vercel 前端跨域请求 WooCommerce API =====
 location ~* ^/wp-json/wc/store/ {
     add_header Access-Control-Allow-Origin "https://ws-cotorie-web.vercel.app" always;
     add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
     add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
     if ($request_method = 'OPTIONS') {
         return 204;
     }
     try_files $uri $uri/ /index.php?$args;
 }
 # ===== CORS END =====
 #CERT-APPLY-CHECK--START
 # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
 include /www/server/panel/vhost/nginx/well-known/wordpress.local.conf;
 #CERT-APPLY-CHECK--END

 #SSL-START SSL相关配置，请勿修改或删除下一行带注释的404规则
 #error_page 404/404.html;
 #SSL-END

 #ERROR-PAGE-START 错误页配置，可以注释、删除或修改
 error_page 404 /404.html;
 #error_page 502 /502.html;
 #ERROR-PAGE-END

 #PHP-INFO-START PHP引用配置，可以注释或修改
 include enable-php-83.conf;
 #PHP-INFO-END

 #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
 include /www/server/panel/vhost/rewrite/wordpress.local.conf;
 #REWRITE-END

 #禁止访问的文件或目录
 location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
 {
 return 404;
 }


 #一键申请SSL证书验证目录相关设置
 location ~ \.well-known{
 allow all;
 }

 #禁止在证书验证目录放入敏感文件
 if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
 return 403;
 }

 location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
 {
 expires 30d;
 error_log /dev/null;
 access_log /dev/null;
 }

 location ~ .*\.(js|css)?$
 {
 expires 12h;
 error_log /dev/null;
 access_log /dev/null;
 }
 access_log /www/wwwlogs/wordpress.local.log;
 error_log /www/wwwlogs/wordpress.local.error.log;
}
